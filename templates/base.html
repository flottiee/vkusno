<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token() }}">
    <title>{{ title if title else "Вкусно." }}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --accent-grad: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
            --glass: rgba(255, 255, 255, 0.8);
        }

        body {
            font-family: 'Inter', sans-serif;
            background: radial-gradient(circle at top right, #fff5f2 0%, #ffe0d8 100%);
            min-height: 100vh;
            color: #2d3436;
        }

        .glass-card {
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.08);
        }

        .btn-primary-grad {
            background: var(--accent-grad);
            border: none;
            color: white;
            font-weight: 600;
            border-radius: 12px;
            transition: all 0.3s ease;
        }

        .btn-primary-grad:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 65, 108, 0.3);
            color: white;
        }

        .fade-in { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-transparent py-4">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="d-flex flex-column align-items-start">
            <a class="navbar-brand fw-800 fs-3 text-dark mb-1" href="/">ВКУСНО<span style="color: #ff4b2b">.</span></a>
            <a href="{{ url_for('menu') }}" class="btn btn-outline-dark btn-sm rounded-4 px-3 py-1">
                <i class="bi bi-list me-1"></i> Меню
            </a>
        </div>

        <a href="{{ url_for('view_cart') }}" class="text-dark position-relative" id="cart-link">
            <i class="bi bi-cart fs-3"></i>
            <span id="cart-badge"
                  class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                  style="font-size: 0.7rem; {% if not cart_total %}display: none;{% endif %}">
                {{ cart_total if cart_total else '' }}
                <span class="visually-hidden">товаров в корзине</span>
            </span>
        </a>
    </div>
</nav>

    <main class="fade-in">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateCartBadge(total) {
            const badge = document.getElementById('cart-badge');
            if (!badge) return;

            if (total > 0) {
                badge.textContent = total;
                badge.style.display = 'inline-block';
            } else {
                badge.style.display = 'none';
                badge.textContent = '';
            }
        }
    </script>
<div class="modal fade" id="authModal" tabindex="-1" aria-labelledby="authModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-4 shadow-lg border-0">
      <div class="modal-header border-0">
        <h5 class="modal-title fw-700" id="authModalLabel">Требуется авторизация</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Закрыть"></button>
      </div>
      <div class="modal-body text-center py-4">
        <i class="bi bi-person-lock fs-1 text-primary mb-3 d-block"></i>
        <p class="mb-4">Чтобы добавлять блюда в корзину, нужно войти или зарегистрироваться.</p>
        <div class="d-flex justify-content-center gap-3">
          <a href="{{ url_for('login') }}" class="btn btn-primary-grad rounded-4 px-4">Войти</a>
          <a href="{{ url_for('register') }}" class="btn btn-outline-primary rounded-4 px-4">Зарегистрироваться</a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
